onboarding = false
[theme]
dark_name = "catppuccin"
auto_switch = true

[theme.custom.light]
panel_bg = "#f6f8fa"
sidebar_bg = "#ffffff"
active_row_bg = "#e1e4e8"
selection_bg = "#d2e2f5"
surface0 = "#ffffff"
surface1 = "#e1e4e8"
surface_dim = "#f6f8fa"
overlay0 = "#959da5"
overlay1 = "#6a737d"
text = "#1f2328"
subtext0 = "#6a737d"
accent = "#0366d6"
mauve = "#5a32a3"
green = "#28a745"
yellow = "#dbab09"
red = "#d73a49"
blue = "#0366d6"
teal = "#1b7c83"
peach = "#cb2431"

[keys]
prefix = "ctrl+a"
settings = ""
rename_tab = "prefix+,"
switch_workspace = "prefix+ctrl+1..9"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/scripts/project-picker.sh"
description = "open project"
width = "80%"
height = "80%"

[ui]
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
confirm_close = false

[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["agent"]]
